<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width" />
    <meta name="robots" content="index, follow" />
    <meta name="description" content="Trim the empty space around your SVGs automatically" />

    <!-- Favicon -->
    <link rel="icon" type="image/svg+xml" href="%sveltekit.assets%/images/favicon.svg" />

    <!-- OG Images -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Auto SVG Crop" />
    <meta property="og:description" content="Trim the empty space around your SVGs automatically" />

    <!-- Preload Fonts -->
    <link
      rel="preload"
      href="%sveltekit.assets%/fonts/Geist.woff2"
      as="font"
      type="font/woff2"
      crossorigin="anonymous"
    />
    <link
      rel="preload"
      href="%sveltekit.assets%/fonts/GeistMono.woff2"
      as="font"
      type="font/woff2"
      crossorigin="anonymous"
    />

    <!-- Title -->
    <title>Auto SVG Crop - Trim the empty space around your SVGs</title>
    %sveltekit.head%
  </head>
  <body
    class="overscroll-none bg-neutral-100 font-sans text-black antialiased selection:bg-neutral-300 dark:bg-neutral-950 dark:text-white dark:selection:bg-neutral-700"
    data-sveltekit-preload-data="hover"
  >
    <div style="display: contents">%sveltekit.body%</div>
  </body>
</html>
