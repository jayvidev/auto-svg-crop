<!doctype html>

    />
    <meta
      name="keywords"
      content="svg crop, auto svg crop, svg trim, trim svg whitespace, svg viewBox, svg optimizer, svgo, inline svg, getBBox"
    />
    <meta name="author" content="jayvidev" />
    <meta
      name="robots"
      content="index, follow, max-image-preview:large, max-snippet:-1, max-video-preview:-1"

    <!-- Favicon -->

      property="og:image:secure_url"
      content="https://auto-svg-crop.jayvi.dev/images/readme.jpg"

    <meta name="twitter:url" content="https://auto-svg-crop.jayvi.dev/" />
    <meta name="twitter:title" content="Auto SVG Crop - Trim the empty space around your SVGs" />
    <meta
      name="twitter:description"

        "author": {

      crossorigin="anonymous"
    />
    <link
      rel="preload"
      href="%sveltekit.assets%/fonts/GeistMono.woff2"
      as="font"
      type="font/woff2"

    %sveltekit.head%

  <body
